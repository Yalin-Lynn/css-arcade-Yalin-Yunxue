<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Arcade Cabinet — Activity 05 build challenge">
  <title>CSS Arcade Cabinet · Team Name</title>
  <!--
    Activity 05 · CSS Arcade Night · Round 3 Build
    Team Name: Yalin&Yunxue
    Members / IDs: 002890652/002890682
    Theme: Arcade Cabinet Build 
  -->
  <style>
    /* ==================================================
       0. DESIGN TOKENS (Checkpoint 6 — custom properties)
       ================================================== */
    :root {
      --bg: #0c0a1a;
      --surface: #16132b;
      --ink: #f8fafc;
      --neon-pink: #f472b6;
      --neon-cyan: #22d3ee;
      --radius: 14px;
      --space: 1rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    /* ==================================================
       1. FLEXBOX — Cabinet header & nav (Checkpoint 1)
       TODO: make .cabinet-header a flex container that
       spaces the logo and nav apart and centers them
       vertically. Make .cabinet-nav a flex row with gap.
       ================================================== */
    .cabinet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: var(--space);
    }

    .cabinet-nav {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    }

    /* ==================================================
       2. CSS GRID — Game board / gallery (Checkpoint 2)
       TODO: build at least a 3 × 3 grid using repeat()
       and fr or fixed tracks. Bonus: grid-template-areas.
       ================================================== */
    .game-grid {
    display: grid;
    grid-template-columns: repeat(3, 120px);
    gap: 12px;
    justify-content: center;
    }

    .tile {
  background: var(--surface);
  border-radius: var(--radius);
  padding: var(--space);
  min-height: 100px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

    /* ==================================================
       3. ANIMATION — Attract-mode motion (Checkpoint 3)
       TODO: create @keyframes with 0%, 50%, 100% stops
       using transform (and a color change). Apply it with
       a delay and a fill mode so it stays put when done.
       ================================================== */
    .marquee-text {
    animation: arcade-pulse 2s ease-in-out 1s forwards;
    }

    @keyframes arcade-pulse {
  0% {
    transform: scale(1);
    color: var(--neon-cyan);
  }

  50% {
    transform: scale(1.15);
    color: var(--neon-pink);
  }

  100% {
    transform: scale(1);
    color: var(--neon-cyan);
  }
     }

    /* @keyframes yourName { ... } */

    /* ==================================================
       4. POSITIONING + Z-INDEX — Layered piece (Checkpoint 4)
       TODO: make .layer-stack the positioned parent and
       place at least 2 .layer children with absolute
       positioning and explicit z-index values.
       ================================================== */
    .layer-stack {
  position: relative;
  min-height: 260px;
}

.layer {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.layer-back {
  top: 40px;
  z-index: 1;
}

.layer-mid {
  top: 100px;
  z-index: 2;
}

.layer-front {
  top: 160px;
  z-index: 3;
}

    /* ==================================================
       5. INTERACTION — hover + focus (Checkpoint 5)
       TODO: add :hover and :focus-visible styles with a
       transition on transform and/or box-shadow.
       ================================================== */
    .tile:hover,
    .tile:focus-visible {
    transform: scale(1.05);
    box-shadow: 0 0 18px var(--neon-cyan);
    }

    /* ==================================================
       6. RESPONSIVE — max-width: 768px (Checkpoint 6)
       TODO: change at least one layout (e.g. stack the
       header, reduce grid columns) on small screens.
       ================================================== */
    @media (max-width: 768px) {
  .cabinet-header {
    flex-direction: column;
    text-align: center;
  }

  .cabinet-nav {
    flex-wrap: wrap;
    justify-content: center;
  }

  .game-grid {
    grid-template-columns: repeat(3, 80px);
  }
}
  </style>
</head>
<body>
  <header class="cabinet-header">
    <h1 class="logo">🕹️ Your Cabinet Title</h1>
    <nav class="cabinet-nav" aria-label="Cabinet">
      <a href="#play">Play</a>
      <a href="#scores">High Scores</a>
      <a href="#merch">Merch</a>
    </nav>
  </header>

  <main>
    <section id="play" aria-labelledby="play-title">
      <h2 id="play-title" class="marquee-text">Press Start</h2>
      <div class="game-grid">
        <div class="tile">1</div>
        <div class="tile">2</div>
        <div class="tile">3</div>
        <div class="tile">4</div>
        <div class="tile">5</div>
        <div class="tile">6</div>
        <div class="tile">7</div>
        <div class="tile">8</div>
        <div class="tile">9</div>
      </div>
    </section>

    <section id="scores" aria-labelledby="scores-title">
      <h2 id="scores-title">High Scores</h2>
      <ol class="score-list">
        <li>AAA · 9,999</li>
        <li>BBB · 7,500</li>
        <li>CCC · 5,000</li>
      </ol>
    </section>

    <section id="merch" aria-labelledby="merch-title">
      <h2 id="merch-title">Layered Showpiece</h2>
      <div class="layer-stack">
        <div class="layer layer-back">Back layer</div>
        <div class="layer layer-mid">Middle layer</div>
        <div class="layer layer-front">Front layer</div>
      </div>
    </section>
  </main>

  <footer class="cabinet-footer">
    <p>&copy; 2026 Team Name · Activity 05</p>
  </footer>
</body>
</html>
